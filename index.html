<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="키즈가드">
<meta name="theme-color" content="#6750A4">
<title>키즈가드 – 자녀 관리</title>
<style>
  :root{
    --bg:#F5F3FA; --card:#FFFFFF; --line:#E4E0EE;
    --brand:#6750A4; --brand-soft:#EDE7F6;
    --text:#1C1B22; --muted:#6B6780; --danger:#B3261E; --ok:#1B7F4B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:8px 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{
    width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;
    font-size:17px;background:#fff;color:var(--text)
  }
  input:focus{outline:2px solid var(--brand);border-color:transparent}
  button{
    padding:14px 12px;border-radius:999px;border:1px solid var(--brand);
    background:#fff;color:var(--brand);font-size:15px;font-weight:600;cursor:pointer
  }
  button.primary{background:var(--brand);color:#fff}
  button.wide{width:100%}
  button:disabled{opacity:.4}
  button.small{padding:10px 8px;font-size:14px}
  .name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
  .dot{width:11px;height:11px;border-radius:50%;background:#BDBDBD;flex:none}
  .dot.on{background:#2BB673}
  .meta{font-size:14px;color:var(--muted);margin-top:4px}
  .meta.warn{color:var(--danger)}
  .big{font-size:15px;color:var(--text);font-weight:600;margin-top:6px}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .err{color:var(--danger);font-size:14px;margin-top:8px}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#1C1B22;color:#fff;padding:12px 18px;border-radius:999px;
    font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;
    max-width:88%;text-align:center
  }
  .toast.show{opacity:1}
  .hist div{font-size:14px;color:var(--muted);padding:3px 0}
  .hist .today{color:var(--text);font-weight:600}
  details{margin-top:10px}
  summary{font-size:14px;color:var(--brand);cursor:pointer;padding:6px 0}
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <div id="login">
    <h1>🛡️ 키즈가드</h1>
    <div class="card">
      <label>가족 참여 코드 (6자리)</label>
      <input id="famCode" inputmode="numeric" autocomplete="off" placeholder="6자리 숫자">
      <label>부모 PIN</label>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="자녀 폰에 설정한 번호">
      <div style="height:14px"></div>
      <button class="primary wide" id="loginBtn">연결하기</button>
      <div class="err" id="loginErr"></div>
      <div class="hint">
        자녀 폰 앱과 같은 코드·PIN을 입력하세요. 한 번 연결하면 이 기기에 기억되어
        다음부터는 바로 열립니다. 홈 화면에 추가하면 앱처럼 쓸 수 있어요.
      </div>
    </div>
  </div>

  <!-- 대시보드 -->
  <div id="dash" style="display:none">
    <h1>👨‍👩‍👧 자녀 관리</h1>
    <div id="children"></div>
    <div class="card">
      <button class="wide" id="logoutBtn">연결 해제</button>
      <div class="hint" id="verLine"></div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, set, get }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTfK7MzagJoNlyfOcYLy3NqeTXCrMbr2Q",
  authDomain: "kidsguard-2c4e0.firebaseapp.com",
  databaseURL: "https://kidsguard-2c4e0-default-rtdb.firebaseio.com",
  projectId: "kidsguard-2c4e0",
  storageBucket: "kidsguard-2c4e0.appspot.com",
  messagingSenderId: "376889465085",
  appId: "1:376889465085:android:5ceb0d2ff6c4d254e74694"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

const $ = id => document.getElementById(id);
let familyId = "", unsub = null;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

/** 앱과 동일한 방식으로 PIN을 되돌릴 수 없는 값으로 바꾼다 */
async function pinHash(fam, pin){
  const data = new TextEncoder().encode(`kidsguard|${fam}|${pin}`);
  const buf  = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ---- 로그인 ----
$("loginBtn").onclick = async () => {
  const fam = $("famCode").value.trim();
  const pin = $("pinInput").value.trim();
  $("loginErr").textContent = "";
  if (!/^\d{4,10}$/.test(fam)) { $("loginErr").textContent = "참여 코드를 확인해 주세요."; return; }
  if (!pin) { $("loginErr").textContent = "PIN을 입력해 주세요."; return; }

  // 5번 틀리면 10분 잠금
  const lockUntil = +(localStorage.getItem("kg_lock") || 0);
  if (Date.now() < lockUntil) {
    $("loginErr").textContent = "여러 번 틀렸습니다. 잠시 후 다시 시도해 주세요.";
    return;
  }

  $("loginBtn").disabled = true;
  try {
    const cred = await signInAnonymously(auth);
    const uid = cred.user.uid;

    // 참여 코드로 실제 가족 ID를 찾는다
    const idSnap = await get(ref(db, `invites/${fam}`));
    if (!idSnap.exists()) {
      $("loginErr").textContent = "이 참여 코드로 등록된 가족이 없습니다.";
      return;
    }
    const famId = idSnap.val();

    const snap = await get(ref(db, `families/${famId}/auth/pinHash`));
    if (!snap.exists()) {
      $("loginErr").textContent = "자녀 폰 앱을 최신으로 업데이트한 뒤 한 번 열어주세요. (PIN 정보가 아직 등록되지 않았습니다)";
      return;
    }
    const want = await pinHash(famId, pin);
    if (snap.val() !== want) {
      const n = (+(localStorage.getItem("kg_fail")||0)) + 1;
      localStorage.setItem("kg_fail", n);
      if (n >= 5) {
        localStorage.setItem("kg_lock", Date.now() + 10*60*1000);
        localStorage.setItem("kg_fail", 0);
        $("loginErr").textContent = "5번 틀려 10분간 잠깁니다.";
      } else {
        $("loginErr").textContent = `PIN이 맞지 않습니다. (${n}/5)`;
      }
      return;
    }
    // PIN이 맞으면 이 기기를 부모로 등록한다 (서버 규칙이 PIN을 다시 확인한다)
    await set(ref(db, `families/${famId}/webParents/${uid}`), {
      pinProof: want, joinedAt: Date.now()
    });

    localStorage.setItem("kg_fail", 0);
    localStorage.setItem("kg_fam", fam);
    localStorage.setItem("kg_famId", famId);
    localStorage.setItem("kg_pin", pin);
    start(famId);
  } catch (e) {
    $("loginErr").textContent = "연결에 실패했습니다. 인터넷을 확인해 주세요.";
    console.error(e);
  } finally {
    $("loginBtn").disabled = false;
  }
};

$("logoutBtn").onclick = () => {
  localStorage.removeItem("kg_fam");
  localStorage.removeItem("kg_famId");
  localStorage.removeItem("kg_pin");
  location.reload();
};

// ---- 대시보드 ----
function start(fam){
  familyId = fam;
  $("login").style.display = "none";
  $("dash").style.display  = "";
  if (unsub) unsub();
  unsub = onValue(ref(db, `families/${fam}/children`), snap => {
    render(snap.val() || {});
  }, err => {
    console.error(err);
    toast("연결이 끊겼습니다");
  });
}

function fmtMin(m){
  if (m == null) return "-";
  return m >= 60 ? `${Math.floor(m/60)}시간 ${m%60}분`.replace(" 0분","") : `${m}분`;
}
function ago(ts){
  if (!ts) return "정보 없음";
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min <= 2) return "방금";
  if (min < 60) return `${min}분 전`;
  return `${Math.floor(min/60)}시간 전`;
}

function render(children){
  const box = $("children");
  const entries = Object.entries(children);
  if (!entries.length) {
    box.innerHTML = `<div class="card">등록된 자녀가 없습니다.</div>`;
    return;
  }
  box.innerHTML = "";
  for (const [cid, c] of entries) {
    const st   = (c && c.status) || {};
    const name = (c && c.profile && c.profile.name) || st.name || "자녀";
    const upd  = st.updatedAt || 0;
    const agoMin = upd ? Math.floor((Date.now()-upd)/60000) : -1;
    const stale  = agoMin < 0 || agoMin > 5;
    const locked = !!st.locked;
    const paused = !!st.paused;
    const isLock = !!st.pauseIsLock;
    const usage  = st.usageTodayMin ?? 0;
    const real   = st.realUsageMin ?? usage;
    const limit  = st.dailyLimitMin ?? 0;
    const extra  = Math.max(0, real - usage);
    const ovr    = st.overrideRemainMin ?? 0;

    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="name"><span class="dot ${stale?"":"on"}"></span>${name}${stale?" (연결 끊김)":""}</div>
      <div class="big">${
        paused ? (isLock ? "🔒 부모님이 잠금" : "⏸️ 잠시 멈춤")
               : locked ? `🔒 잠금 중${st.lockReason?` (${st.lockReason})`:""}`
               : "사용 가능"
      }${ovr>0?` · 임시해제 ${ovr}분`:""}</div>
      ${extra>0?`<div class="meta">📱 실제 사용 ${fmtMin(real)} (한도 ${fmtMin(usage)} + 부여 ${extra}분)</div>`:""}
      <div class="meta">오늘 ${usage}분${limit>0?` / ${limit}분`:""}${
        st.tempC?` · 🌡️ ${Math.round(st.tempC)}℃`:""}</div>
      <div class="meta">📷 거리 감지: ${
        st.distanceGuardOn === false ? "꺼짐"
        : st.cameraActive ? "작동 중" : "⚠️ 대기 중"}</div>
      <div class="meta ${stale?"warn":""}">마지막 확인: ${ago(upd)}</div>
      <div class="sep"></div>
      <div class="row">
        ${paused
          ? `<button class="primary" data-cmd="RESUME" data-cid="${cid}">${isLock?"🔓 잠금 풀기":"▶️ 다시 허용"}</button>`
          : locked
            ? `<button class="primary" data-cmd="UNLOCK" data-min="30" data-cid="${cid}">🔓 30분 풀어주기</button>`
            : `<button data-cmd="LOCK" data-cid="${cid}">🔒 잠그기</button>`}
      </div>
      ${paused?"":`
      <div style="height:8px"></div>
      <div class="row">
        <button class="small" data-cmd="PAUSE" data-cid="${cid}">⏸️ 잠시 멈춤</button>
      </div>`}
      <div style="height:8px"></div>
      <div class="row">
        ${[10,30,60,90].map(m=>
          `<button class="small" data-cmd="EXTEND" data-min="${m}" data-cid="${cid}">+${m}m</button>`
        ).join("")}
      </div>
      <div class="hint">누르면 잠금이 풀리고 그 시간만큼 쓸 수 있습니다. 남은 시간이 있으면 더해집니다.</div>
      <div style="height:8px"></div>
      <div class="row">
        <button class="small" data-cmd="PING" data-cid="${cid}">🔄 새로고침</button>
        <button class="small" data-cmd="REQUEST_LOCATION" data-cid="${cid}">📍 위치 요청</button>
        <button class="small" data-map="${cid}" ${st.lat?"":"disabled"}>🗺️ 지도</button>
      </div>
      ${renderHist(st)}
    `;
    box.appendChild(el);
  }

  box.querySelectorAll("button[data-cmd]").forEach(b => {
    b.onclick = () => sendCmd(b.dataset.cid, b.dataset.cmd, +(b.dataset.min||0), b);
  });
  box.querySelectorAll("button[data-map]").forEach(b => {
    b.onclick = () => {
      const st = (children[b.dataset.map]||{}).status || {};
      if (st.lat) window.open(`https://maps.google.com/?q=${st.lat},${st.lng}`, "_blank");
    };
  });
}

function renderHist(st){
  const h = st.usageHistory || "", rh = st.realHistory || "";
  if (!h) return "";
  const realMap = {};
  rh.split(",").filter(x=>x.includes(":")).forEach(x=>{
    realMap[x.split(":")[0]] = +x.split(":")[1];
  });
  const today = new Date();
  const tk = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,"0")}${String(today.getDate()).padStart(2,"0")}`;
  const rows = h.split(",").filter(x=>x.includes(":")).map(x=>{
    const d = x.split(":")[0], m = +x.split(":")[1];
    if (d.length !== 8) return "";
    const real = realMap[d] ?? m, ex = Math.max(0, real-m);
    const label = `${d.slice(4,6)}/${d.slice(6,8)}`;
    return `<div class="${d===tk?"today":""}">${d===tk?`오늘 (${label})`:label} &nbsp; ${fmtMin(real)}${
      ex>0?` <span style="opacity:.7">(한도 ${fmtMin(m)} + 부여 ${ex}분)</span>`:""}</div>`;
  }).join("");
  return `<details><summary>📅 날짜별 사용 시간</summary><div class="hist">${rows}</div></details>`;
}

async function sendCmd(cid, type, minutes, btn){
  btn.disabled = true;
  try {
    await set(ref(db, `families/${familyId}/children/${cid}/command`), {
      type, minutes, payload: "",
      issuedAt: Date.now(),
      issuedBy: "web"
    });
    toast(type === "REQUEST_LOCATION" ? "위치를 요청했습니다 (5~15초)" : "전송했습니다");
  } catch (e) {
    console.error(e);
    toast("전송 실패 — 인터넷을 확인해 주세요");
  } finally {
    setTimeout(()=>{ btn.disabled = false; }, 800);
  }
}

// 저장된 로그인으로 자동 연결
(async () => {
  const fam   = localStorage.getItem("kg_fam");
  const famId = localStorage.getItem("kg_famId");
  const pin   = localStorage.getItem("kg_pin");
  $("verLine").textContent = "웹 v1.0";
  if (!fam || !pin) return;
  try {
    const cred = await signInAnonymously(auth);
    const uid  = cred.user.uid;
    const id   = famId || (await get(ref(db, `invites/${fam}`))).val();
    if (!id) return;
    const snap = await get(ref(db, `families/${id}/auth/pinHash`));
    const want = await pinHash(id, pin);
    if (!snap.exists() || snap.val() !== want) return;
    // 익명 로그인 ID는 바뀔 수 있으므로 매번 등록해 둔다
    await set(ref(db, `families/${id}/webParents/${uid}`), {
      pinProof: want, joinedAt: Date.now()
    });
    localStorage.setItem("kg_famId", id);
    start(id);
  } catch (e) { console.error(e); }
})();
</script>
</body>
</html>
