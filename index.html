<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="키즈가드">
<meta name="theme-color" content="#6750A4">
<title>키즈가드 – 자녀 관리</title>
<style>
  :root{
    --bg:#F5F3FA; --card:#FFFFFF; --line:#E4E0EE;
    --brand:#6750A4; --brand-soft:#EDE7F6;
    --text:#1C1B22; --muted:#6B6780; --danger:#B3261E; --ok:#1B7F4B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:8px 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  input{
    width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;
    font-size:17px;background:#fff;color:var(--text)
  }
  input:focus{outline:2px solid var(--brand);border-color:transparent}
  button{
    padding:14px 12px;border-radius:999px;border:1px solid var(--brand);
    background:#fff;color:var(--brand);font-size:15px;font-weight:600;cursor:pointer
  }
  button.primary{background:var(--brand);color:#fff}
  button.wide{width:100%}
  button:disabled{opacity:.4}
  button.small{padding:10px 8px;font-size:14px}
  .name{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
  .dot{width:11px;height:11px;border-radius:50%;background:#BDBDBD;flex:none}
  .dot.on{background:#2BB673}
  .meta{font-size:14px;color:var(--muted);margin-top:4px}
  .meta.warn{color:var(--danger)}
  .big{font-size:15px;color:var(--text);font-weight:600;margin-top:6px}
  .sep{height:1px;background:var(--line);margin:14px 0}
  .hint{font-size:13px;color:var(--muted);margin-top:8px}
  .err{color:var(--danger);font-size:14px;margin-top:8px}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:#1C1B22;color:#fff;padding:12px 18px;border-radius:999px;
    font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50;
    max-width:88%;text-align:center
  }
  .toast.show{opacity:1}
  .hist div{font-size:14px;color:var(--muted);padding:3px 0}
  .hist .today{color:var(--text);font-weight:600}
  details{margin-top:10px}
  .sheet{
    position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);display:none
  }
  .sheet.open{display:block}
  .sheet .bar{
    position:sticky;top:0;background:var(--bg);padding:12px 16px;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;z-index:2
  }
  .sheet .bar b{flex:1;font-size:17px}
  .grp{font-weight:700;margin:0 0 10px}
  .item{display:flex;align-items:center;gap:10px;padding:9px 0}
  .item .lab{flex:1;font-size:15px}
  .item .val{font-size:15px;font-weight:600;color:var(--brand);min-width:74px;text-align:right}
  input[type=range]{width:100%;accent-color:var(--brand)}
  .seg{display:flex;gap:6px;margin:6px 0}
  .seg button{flex:1;padding:10px 4px;font-size:14px}
  .seg button.on{background:var(--brand);color:#fff}
  .sw{
    width:52px;height:31px;border-radius:999px;background:#D6D2E0;position:relative;
    flex:none;cursor:pointer;transition:.2s;border:none
  }
  .sw.on{background:var(--brand)}
  .sw::after{
    content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;
    border-radius:50%;background:#fff;transition:.2s
  }
  .sw.on::after{left:24px}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1}
  .tabs button.on{background:var(--brand);color:#fff}
  summary{font-size:14px;color:var(--brand);cursor:pointer;padding:6px 0}

  /* ---- 자녀 알림 팝업 ---- */
  .modal{
    position:fixed;inset:0;background:rgba(28,27,34,.45);z-index:60;
    display:none;align-items:flex-start;justify-content:center;
    padding:calc(env(safe-area-inset-top) + 24px) 16px 16px;overflow-y:auto
  }
  .modal.open{display:flex}
  .modal .box{
    background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:420px;
    box-shadow:0 18px 40px rgba(0,0,0,.22)
  }
  .modal h2{font-size:18px;margin:0 0 4px}
  .alert-item{border-top:1px solid var(--line);padding:10px 0}
  .alert-item:first-of-type{border-top:none}
  .alert-item .who{font-size:13px;color:var(--muted)}
  .alert-item .msg{font-size:16px;font-weight:600;margin-top:2px}
  .alert-item.newest .msg{font-size:18px}
  .bell{
    position:relative;display:flex;align-items:center;gap:8px;
    font-size:15px;font-weight:600
  }
  .badge{
    background:var(--danger);color:#fff;border-radius:999px;
    font-size:12px;padding:1px 8px;font-weight:700
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <div id="login">
    <h1>🛡️ 키즈가드</h1>
    <div class="card">
      <label>가족 참여 코드 (6자리)</label>
      <input id="famCode" inputmode="numeric" autocomplete="off" placeholder="6자리 숫자">
      <label>부모 PIN</label>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="자녀 폰에 설정한 번호">
      <div style="height:14px"></div>
      <button class="primary wide" id="loginBtn">연결하기</button>
      <div class="err" id="loginErr"></div>
      <div class="hint">
        자녀 폰 앱과 같은 코드·PIN을 입력하세요. 한 번 연결하면 이 기기에 기억되어
        다음부터는 바로 열립니다. 홈 화면에 추가하면 앱처럼 쓸 수 있어요.
      </div>
    </div>
  </div>

  <!-- 대시보드 -->
  <div id="dash" style="display:none">
    <h1>👨‍👩‍👧 자녀 관리</h1>

    <!-- 자녀 알림 -->
    <div class="card">
      <div class="bell">🔔 자녀 알림 <span class="badge" id="alertBadge" style="display:none">0</span></div>
      <div class="hint" id="alertHint">
        재부팅·삭제 시도·안전 구역 이탈 등이 생기면 이 화면에 팝업으로 알려드립니다.
      </div>
      <div style="height:8px"></div>
      <button class="small wide" id="notifBtn">📢 알림 켜기 (화면을 닫아도 받기)</button>
      <div class="hint" id="notifHint"></div>
      <details id="alertHistWrap" style="display:none">
        <summary>지난 알림 보기</summary>
        <div class="hist" id="alertHist"></div>
      </details>
    </div>

    <div id="children"></div>
    <div class="card">
      <button class="wide" id="logoutBtn">연결 해제</button>
      <div class="hint" id="verLine"></div>
    </div>
  </div>

</div>

<!-- 새 알림 팝업 -->
<div class="modal" id="alertModal">
  <div class="box">
    <h2>🛡️ 키즈가드 알림</h2>
    <div id="alertBody"></div>
    <div style="height:14px"></div>
    <div class="row">
      <button class="primary small" id="alertOkBtn">확인</button>
    </div>
  </div>
</div>

<!-- 설정 화면 -->
<div class="sheet" id="sheet">
  <div class="bar">
    <button class="small" id="sheetClose">← 뒤로</button>
    <b id="sheetName">설정</b>
  </div>
  <div class="wrap" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getDatabase, ref, onValue, onChildAdded, query, limitToLast, set, get }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBTfK7MzagJoNlyfOcYLy3NqeTXCrMbr2Q",
  authDomain: "kidsguard-2c4e0.firebaseapp.com",
  databaseURL: "https://kidsguard-2c4e0-default-rtdb.firebaseio.com",
  projectId: "kidsguard-2c4e0",
  storageBucket: "kidsguard-2c4e0.appspot.com",
  messagingSenderId: "376889465085",
  appId: "1:376889465085:android:5ceb0d2ff6c4d254e74694"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getDatabase(app);

const $ = id => document.getElementById(id);
let familyId = "", unsub = null;

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2200);
}

/** 앱과 동일한 방식으로 PIN을 되돌릴 수 없는 값으로 바꾼다 */
async function pinHash(fam, pin){
  const data = new TextEncoder().encode(`kidsguard|${fam}|${pin}`);
  const buf  = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

// ---- 로그인 ----
$("loginBtn").onclick = async () => {
  const fam = $("famCode").value.trim();
  const pin = $("pinInput").value.trim();
  $("loginErr").textContent = "";
  if (!/^\d{4,10}$/.test(fam)) { $("loginErr").textContent = "참여 코드를 확인해 주세요."; return; }
  if (!pin) { $("loginErr").textContent = "PIN을 입력해 주세요."; return; }

  // 5번 틀리면 10분 잠금
  const lockUntil = +(localStorage.getItem("kg_lock") || 0);
  if (Date.now() < lockUntil) {
    $("loginErr").textContent = "여러 번 틀렸습니다. 잠시 후 다시 시도해 주세요.";
    return;
  }

  $("loginBtn").disabled = true;
  try {
    const cred = await signInAnonymously(auth);
    const uid = cred.user.uid;

    // 참여 코드로 실제 가족 ID를 찾는다
    const idSnap = await get(ref(db, `invites/${fam}`));
    if (!idSnap.exists()) {
      $("loginErr").textContent = "이 참여 코드로 등록된 가족이 없습니다.";
      return;
    }
    const famId = idSnap.val();

    // 자녀마다 PIN이 다를 수 있다. 등록된 것 중 하나라도 맞으면 통과시킨다.
    const want = await pinHash(famId, pin);
    const pinsSnap = await get(ref(db, `families/${famId}/auth/pins`));
    const legacy   = await get(ref(db, `families/${famId}/auth/pinHash`));
    const hashes = [];
    if (pinsSnap.exists()) hashes.push(...Object.values(pinsSnap.val() || {}));
    if (legacy.exists()) hashes.push(legacy.val());
    if (!hashes.length) {
      $("loginErr").textContent = "자녀 폰 앱을 최신으로 업데이트한 뒤 한 번 열어주세요. (PIN 정보가 아직 등록되지 않았습니다)";
      return;
    }
    let matchedChild = "";
    if (pinsSnap.exists()) {
      for (const [cid, h] of Object.entries(pinsSnap.val() || {})) {
        if (h === want) { matchedChild = cid; break; }
      }
    }
    if (!hashes.includes(want)) {
      const n = (+(localStorage.getItem("kg_fail")||0)) + 1;
      localStorage.setItem("kg_fail", n);
      if (n >= 5) {
        localStorage.setItem("kg_lock", Date.now() + 10*60*1000);
        localStorage.setItem("kg_fail", 0);
        $("loginErr").textContent = "5번 틀려 10분간 잠깁니다.";
      } else {
        $("loginErr").textContent = `PIN이 맞지 않습니다. (${n}/5)`;
      }
      return;
    }
    // PIN이 맞으면 이 기기를 부모로 등록한다 (서버 규칙이 PIN을 다시 확인한다)
    await set(ref(db, `families/${famId}/webParents/${uid}`), {
      pinProof: want, childRef: matchedChild, joinedAt: Date.now()
    });

    localStorage.setItem("kg_fail", 0);
    localStorage.setItem("kg_fam", fam);
    localStorage.setItem("kg_famId", famId);
    localStorage.setItem("kg_pin", pin);
    start(famId);
  } catch (e) {
    $("loginErr").textContent = "연결에 실패했습니다. 인터넷을 확인해 주세요.";
    console.error(e);
  } finally {
    $("loginBtn").disabled = false;
  }
};

$("logoutBtn").onclick = () => {
  localStorage.removeItem("kg_fam");
  localStorage.removeItem("kg_famId");
  localStorage.removeItem("kg_pin");
  // 알림 확인 기록은 남겨두지 않는다 (다른 가족으로 연결할 수 있으므로)
  if (familyId) localStorage.removeItem(`kg_alert_seen_${familyId}`);
  location.reload();
};

// ---- 대시보드 ----
function start(fam){
  familyId = fam;
  $("login").style.display = "none";
  $("dash").style.display  = "";
  if (unsub) unsub();
  unsub = onValue(ref(db, `families/${fam}/children`), snap => {
    render(snap.val() || {});
    watchAlerts(snap.val() || {});
  }, err => {
    console.error(err);
    toast("연결이 끊겼습니다");
  });
  updateNotifHint();
}

/* ================= 자녀 알림 (팝업) =================
   자녀 폰이 families/{fam}/children/{cid}/alerts 에 남긴 알림을 읽어
   화면 위에 팝업으로 띄운다. 아이폰은 부모 앱을 설치할 수 없어서
   이 화면이 곧 부모 앱 역할을 한다.

   화면을 닫아둔 동안에는 브라우저 알림으로 받는다. 아이폰은 홈 화면에
   추가해 앱처럼 열어야 알림 권한을 줄 수 있다 (iOS 16.4 이상).      */

const seenKey = () => `kg_alert_seen_${familyId}`;
// 처음 연결한 기기에서 옛 알림이 한꺼번에 쏟아지지 않도록, 마지막 확인 시각이
// 없으면 '하루 전'부터 본 것으로 친다.
function lastSeen(){
  const v = +(localStorage.getItem(seenKey()) || 0);
  return Math.max(v, Date.now() - 24*60*60*1000);
}
function setLastSeen(at){
  if (at > +(localStorage.getItem(seenKey()) || 0)) {
    localStorage.setItem(seenKey(), at);
  }
}

let alertWatchers = {};   // cid → true (같은 아이에 두 번 걸지 않도록)
let alertLog = [];        // 최근 알림 (최신순)
let alertQueue = [];      // 아직 확인하지 않은 알림
const seenIds = new Set();

function watchAlerts(children){
  const since = lastSeen();
  for (const [cid, c] of Object.entries(children)) {
    if (alertWatchers[cid]) continue;
    alertWatchers[cid] = true;
    const name = (c && c.profile && c.profile.name) ||
                 (c && c.status && c.status.name) || "자녀";
    const q = query(ref(db, `families/${familyId}/children/${cid}/alerts`), limitToLast(20));
    onChildAdded(q, snap => {
      const a = snap.val() || {};
      const id = `${cid}/${snap.key}`;
      if (seenIds.has(id)) return;
      seenIds.add(id);
      const item = {
        id, cid, name: a.name || name, text: a.text || "",
        at: a.at || 0, silent: !!a.silent, lat: a.lat, lng: a.lng
      };
      alertLog.unshift(item);
      alertLog = alertLog.slice(0, 50);
      renderAlertLog();
      // 조용한 알림(정기 위치 보고)은 기록만 남기고 팝업을 띄우지 않는다
      if (item.silent) return;
      // 이 기기에서 이미 확인한 시각보다 오래된 것은 다시 띄우지 않는다
      if (item.at <= since) return;
      popAlert(item);
    }, err => console.error(err));
  }
}

function popAlert(item){
  alertQueue.unshift(item);
  alertQueue = alertQueue.slice(0, 5);
  renderAlertModal();
  notifyBrowser(item);
  // 소리·진동으로도 알린다 (기기가 허용할 때만)
  if (navigator.vibrate) { try { navigator.vibrate([120, 80, 120]); } catch(e){} }
}

function renderAlertModal(){
  if (!alertQueue.length) { $("alertModal").classList.remove("open"); return; }
  // 지도 버튼은 알림마다 따로 붙인다. 맨 위 알림에만 붙이면, 위치를 물어본 직후
  // 위치 없는 알림(재부팅 등)이 하나 더 오는 순간 지도를 열 수 없게 된다.
  $("alertBody").innerHTML = alertQueue.map((a,i)=>`
    <div class="alert-item ${i===0?"newest":""}">
      <div class="who">${escapeHtml(a.name)} · ${fmtWhen(a.at)}</div>
      <div class="msg">${escapeHtml(a.text)}</div>
      ${a.lat ? `<button class="small" data-map="${i}"
                   style="margin-top:8px">🗺️ 이 위치를 지도로 보기</button>` : ""}
    </div>`).join("");

  $("alertBody").querySelectorAll("button[data-map]").forEach(b => {
    b.onclick = () => {
      const a = alertQueue[+b.dataset.map];
      if (a && a.lat) window.open(`https://maps.google.com/?q=${a.lat},${a.lng}`, "_blank");
      closeAlerts();
    };
  });

  $("alertModal").classList.add("open");
  updateBadge();
}

function closeAlerts(){
  const newest = alertQueue[0];
  if (newest) setLastSeen(newest.at);
  alertQueue = [];
  $("alertModal").classList.remove("open");
  updateBadge();
}
$("alertOkBtn").onclick = closeAlerts;

function updateBadge(){
  const b = $("alertBadge");
  if (alertQueue.length) { b.style.display = ""; b.textContent = alertQueue.length; }
  else b.style.display = "none";
}

function renderAlertLog(){
  const wrap = $("alertHistWrap");
  if (!alertLog.length) { wrap.style.display = "none"; return; }
  wrap.style.display = "";
  $("alertHist").innerHTML = alertLog.slice(0, 20).map(a =>
    `<div>${fmtWhen(a.at)} · ${escapeHtml(a.name)} — ${escapeHtml(a.text)}</div>`).join("");
}

function fmtWhen(at){
  if (!at) return "-";
  const d = new Date(at);
  const p = n => String(n).padStart(2, "0");
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---- 브라우저 알림 (화면을 닫아둬도 받기) ----
function notifyBrowser(item){
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try {
    const n = new Notification(`${item.name} - 키즈가드`, {
      // 위치가 함께 온 알림은 눌러서 바로 지도로 갈 수 있다고 알려준다
      body: item.lat ? `${item.text}\n(눌러서 지도 보기)` : item.text,
      tag: item.id,
    });
    n.onclick = () => {
      // 알림을 누르면 이 화면을 앞으로 가져오고, 위치가 있으면 지도까지 연다
      window.focus();
      if (item.lat) window.open(`https://maps.google.com/?q=${item.lat},${item.lng}`, "_blank");
      n.close();
    };
  } catch(e){ console.error(e); }
}

function updateNotifHint(){
  const btn = $("notifBtn"), hint = $("notifHint");
  if (!("Notification" in window)) {
    btn.style.display = "none";
    hint.textContent = "이 브라우저는 알림을 지원하지 않습니다. 화면을 열어두면 팝업으로 알려드립니다.";
    return;
  }
  if (Notification.permission === "granted") {
    btn.style.display = "none";

function fmtMin(m){
  if (m == null) return "-";
  return m >= 60 ? `${Math.floor(m/60)}시간 ${m%60}분`.replace(" 0분","") : `${m}분`;
}
function ago(ts){
  if (!ts) return "정보 없음";
  const min = Math.floor((Date.now() - ts) / 60000);
  if (min <= 2) return "방금";
  if (min < 60) return `${min}분 전`;
  return `${Math.floor(min/60)}시간 전`;
}

function renderHist(st){
  const h = st.usageHistory || "", rh = st.realHistory || "";
  if (!h) return "";
  const realMap = {};
  rh.split(",").filter(x=>x.includes(":")).forEach(x=>{
    realMap[x.split(":")[0]] = +x.split(":")[1];
  });
  const today = new Date();
  const tk = `${today.getFullYear()}${String(today.getMonth()+1).padStart(2,"0")}${String(today.getDate()).padStart(2,"0")}`;
  const rows = h.split(",").filter(x=>x.includes(":")).map(x=>{
    const d = x.split(":")[0], m = +x.split(":")[1];
    if (d.length !== 8) return "";
    const real = realMap[d] ?? m, ex = Math.max(0, real-m);
    const label = `${d.slice(4,6)}/${d.slice(6,8)}`;
    return `<div class="${d===tk?"today":""}">${d===tk?`오늘 (${label})`:label} &nbsp; ${fmtMin(real)}${
      ex>0?` <span style="opacity:.7">(한도 ${fmtMin(m)} + 부여 ${ex}분)</span>`:""}</div>`;
  }).join("");
  return `<details><summary>📅 날짜별 사용 시간</summary><div class="hist">${rows}</div></details>`;
}

async function sendCmd(cid, type, minutes, btn){
  btn.disabled = true;
  try {
    await set(ref(db, `families/${familyId}/children/${cid}/command`), {
      type, minutes, payload: "",
      issuedAt: Date.now(),
      issuedBy: "web"
    });
    toast(type === "REQUEST_LOCATION" ? "위치를 요청했습니다 (5~15초)" : "전송했습니다");
  } catch (e) {
    console.error(e);
    toast("전송 실패 — 인터넷을 확인해 주세요");
  } finally {
    setTimeout(()=>{ btn.disabled = false; }, 800);
  }
}

      <div class="grp">✋ 카메라 가림 대응</div>
      ${seg("가림 감지","covered_action", st.coveredAction ?? 1, ["무시","알림만","알림+차단"])}
      ${sl("가림 판정 시간","covered_alert_sec", st.coveredAlertSec ?? 60, 15, 300, 15, " 초")}
      <div class="grp" style="margin-top:14px">📷 거리 감지 미시작 대응</div>
      ${sl("알림까지","cam_idle_alert_min", st.camIdleAlertMin ?? 10, 1, 60, 1, " 분")}
      ${sw("그래도 안 켜면 사용 차단","cam_idle_lock", !!st.camIdleLockOn)}
    </div>
    <div style="height:24px"></div>
  `
  .replaceAll("%BRK%",  p+"break_interval_min")
  .replaceAll("%BDUR%", p+"break_duration_min")
  .replaceAll("%DAY%",  p+"daily_limit_min")
  .replaceAll("%BEDON%",p+"bedtime_enabled")
  .replaceAll("%BEDS%", p+"bedtime_start_hour")
  .replaceAll("%BEDE%", p+"bedtime_end_hour");

  // 평일/주말 탭
  $("sheetBody").querySelectorAll("button[data-tab]").forEach(b=>{
    b.onclick = () => { curTab = b.dataset.tab === "1"; openSettings(curCid, curChild); };
  });
  // 스위치
  $("sheetBody").querySelectorAll("button[data-sw]").forEach(b=>{
    b.onclick = () => {
      const on = b.dataset.on === "1" ? 0 : 1;
      b.dataset.on = on; b.classList.toggle("on", on===1);
      setVal(b.dataset.sw, on===1 ? "true" : "false");
    };
  });
  // 슬라이더 (손을 뗄 때 전송)
  $("sheetBody").querySelectorAll("input[data-sl]").forEach(r=>{
    const out = $("v_"+r.dataset.sl);
    r.oninput  = () => { if(out) out.textContent = r.value + (r.dataset.unit||""); };
    r.onchange = () => setVal(r.dataset.sl, r.value);
  });
  // 3단 선택
  $("sheetBody").querySelectorAll("button[data-seg]").forEach(b=>{
    b.onclick = () => {
      const key = b.dataset.seg;
      $("sheetBody").querySelectorAll(`button[data-seg="${key}"]`)
        .forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      setVal(key, b.dataset.v);
    };
  });
  // 사용시간 초기화
  $("resetUsage").onclick = async () => {
    await set(ref(db, `families/${familyId}/children/${curCid}/command`), {
      type: "SET_VALUE", minutes: 0, payload: "__reset_usage__=1",
      issuedAt: Date.now(), issuedBy: "web"
    });
    toast("오늘 사용 시간을 초기화했습니다");
  };

  $("sheet").classList.add("open");
  window.scrollTo(0,0);
}

// 저장된 로그인으로 자동 연결
(async () => {
  const fam   = localStorage.getItem("kg_fam");
  const famId = localStorage.getItem("kg_famId");
  const pin   = localStorage.getItem("kg_pin");
  $("verLine").textContent = "웹 v1.1 (자녀 알림 팝업)";
  updateNotifHint();
  if (!fam || !pin) return;
  try {
    const cred = await signInAnonymously(auth);
    const uid  = cred.user.uid;
    const id   = famId || (await get(ref(db, `invites/${fam}`))).val();
    if (!id) return;
    const want = await pinHash(id, pin);
    const pinsSnap = await get(ref(db, `families/${id}/auth/pins`));
    const legacy   = await get(ref(db, `families/${id}/auth/pinHash`));
    const hashes = [];
    if (pinsSnap.exists()) hashes.push(...Object.values(pinsSnap.val() || {}));
    if (legacy.exists()) hashes.push(legacy.val());
    if (!hashes.includes(want)) return;
    let matchedChild = "";
    if (pinsSnap.exists()) {
      for (const [cid, h] of Object.entries(pinsSnap.val() || {})) {
        if (h === want) { matchedChild = cid; break; }
      }
    }
    // 익명 로그인 ID는 바뀔 수 있으므로 매번 등록해 둔다
    await set(ref(db, `families/${id}/webParents/${uid}`), {
      pinProof: want, childRef: matchedChild, joinedAt: Date.now()
    });
    localStorage.setItem("kg_famId", id);
    start(id);
  } catch (e) { console.error(e); }
})();
</script>
</body>
</html>
